# NGINX configuration for Q-Safe (Deterministic Deployment)
# This handles SSL termination (Let's Encrypt), static file serving, and WebSocket proxying.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Global proxy settings
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    
    # Support high throughput binary payloads in P2P transfers
    client_max_body_size 1G;

    server {
        listen 443 ssl;
        server_name q-safe.live www.q-safe.live;

        # SSL Certificates (mounted from host into the container)
        ssl_certificate /etc/letsencrypt/live/q-safe.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/q-safe.live/privkey.pem;
        
        # Modern SSL profile for security/compliance
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

        # Forwarded Headers for Django & WebRTC handshake
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Signaling for P2P Handshakes
        location /ws/ {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400; # Stable long-lived connections for complex transfers
        }

        # Django API & Frontend serving
        location / {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name q-safe.live www.q-safe.live;
        return 301 https://$host$request_uri;
    }
}

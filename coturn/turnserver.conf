# COTURN configuration for Q-Safe (Deterministic Deployment)
listening-port=3478
tls-listening-port=5349

# EC2 Static IP bypassing DNS dependency for colleges
# This ensures that even if college DNS blocks q-safe.live, the IP-based handshake persists.
external-ip=52.63.153.228

# Persistence
userdb=/var/lib/coturn/turndb

# Authentication
# Static user matching P2PSend.jsx ICE_SERVERS configuration.
user=qsafe:QSAFE_SECURE_PASSWORD_123!
realm=q-safe.live

# Network optimizations for high-throughput parallel lanes
# Large port range to accommodate high concurrency during striping.
min-port=50000
max-port=60000

# Security & Compliance
fingerprint
lt-cred-mech

# Performance tuning
cli-password=QSAFE_CLI_PASSWORD_999
verbose
simple-log
log-file=/var/log/turn.log

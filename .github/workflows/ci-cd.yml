name: Q-Safe CI/CD Pipeline

on:
  push:
    branches: [dev]
  workflow_dispatch: # allows manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Backend checks
  # ─────────────────────────────────────────────
  backend-check:
    name: Backend — Install & Django Check
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-not-real
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: sqlite:///ci-test.db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libzbar0 libzbar-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        working-directory: backend
        run: |
          python manage.py check --deploy 2>&1 | grep -v "^System check" || true
          python manage.py check

      - name: Verify migrations are up to date
        working-directory: backend
        run: |
          python manage.py migrate --run-syncdb
          python manage.py migrate --check

      - name: Smoke-test critical imports
        working-directory: backend
        run: |
          python -c "
          import django, os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'backend.settings')
          django.setup()
          from django.contrib.auth.models import User
          print('Django imports: OK')
          "

  # ─────────────────────────────────────────────
  # JOB 2 — Frontend build
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend — Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Ensure ajv compatibility for react-scripts toolchain
        working-directory: frontend
        run: npm install ajv@8.17.1 ajv-keywords@5.1.0 --no-save --legacy-peer-deps

      - name: Build React app
        working-directory: frontend
        env:
          REACT_APP_API_URL: https://q-safe.live
          REACT_APP_URL: https://q-safe.live
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Check build output exists
        run: |
          test -f frontend/build/index.html || (echo "Build failed — index.html missing" && exit 1)
          test -d frontend/build/static || (echo "Build failed — static assets missing" && exit 1)
          echo "Build output verified OK"

  # ─────────────────────────────────────────────
  # JOB 3 — Merge dev → production
  # ─────────────────────────────────────────────
  merge-to-production:
    name: Merge dev → production
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-build]
    if: success()
    outputs:
      merged: ${{ steps.merge.outputs.merged }}

    steps:
      - name: Checkout repo (full history needed for merge)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into production
        id: merge
        run: |
          set +e
          git checkout production
          git merge dev --no-ff -m "chore: auto-merge dev → production [CI passed] $(date -u '+%Y-%m-%d %H:%M UTC')"
          merge_exit=$?

          if [ $merge_exit -eq 0 ]; then
            git push origin production
            echo "Merged dev → production successfully"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Auto-merge conflict detected. Falling back to PR flow."
          git merge --abort || true
          echo "merged=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create PR for manual conflict resolution
        if: steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e

          existing_pr=$(gh api \
            "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:dev&base=production" \
            --jq '.[0].number')

          if [ -n "$existing_pr" ] && [ "$existing_pr" != "null" ]; then
            echo "Conflict PR already exists: #$existing_pr"
            exit 0
          fi

          gh api \
            --method POST \
            "repos/${{ github.repository }}/pulls" \
            -f title="chore: merge dev into production (manual conflict resolution required)" \
            -f head="dev" \
            -f base="production" \
            -f body="CI could not auto-merge dev into production due to conflicts. Please resolve conflicts (notably in backend/transfers/views.py), then merge this PR."

          pr_create_exit=$?
          if [ $pr_create_exit -ne 0 ]; then
            echo "Warning: Failed to create PR automatically (token/repo policy may block this)."
            echo "Please create PR manually: dev -> production"
          fi

          exit 0

      - name: Mark job as blocked by conflicts
        if: steps.merge.outputs.merged == 'false'
        run: |
          echo "Auto-merge blocked by conflicts. PR created for manual resolution."
          exit 1

  # ─────────────────────────────────────────────
  # JOB 4 — Deploy to EC2
  # ─────────────────────────────────────────────
  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [merge-to-production]
    if: needs.merge-to-production.outputs.merged == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 300s
          script: |
            set -e

            echo "=== Starting deployment ==="
            cd ~/Q-Safe

            echo "=== Pulling latest production ==="
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin
            git checkout production
            git pull --ff-only origin production

            echo "=== Rebuilding Docker containers ==="
            docker-compose down --remove-orphans
            docker system prune -af --volumes || true
            docker builder prune -af || true
            docker-compose build
            docker-compose up -d

            echo "=== Waiting for app to start ==="
            sleep 15

            echo "=== Health check ==="
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health/ --max-time 10)
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed (HTTP $STATUS)"
                break
              fi
              if [ $i -eq 5 ]; then
                echo "Health check FAILED after 5 attempts (HTTP $STATUS)"
                echo "Rolling back..."
                docker-compose down
                git checkout HEAD~1
                docker-compose build
                docker-compose up -d
                exit 1
              fi
              echo "Attempt $i failed (HTTP $STATUS), retrying in 10s..."
              sleep 10
            done

            echo "=== Cleaning up old Docker images ==="
            docker image prune -f

            echo "=== Deployment complete ==="

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment FAILED. Check the SSH logs above."
          echo "Production branch was merged but EC2 deploy failed."
          echo "Manually SSH in and check: docker-compose logs"
          exit 1

server {
    listen 443 ssl;
    server_name q-safe.live www.q-safe.live;

    ssl_certificate /etc/letsencrypt/live/q-safe.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/q-safe.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security hardening: block common attack/scanner paths ─────────────────

    # Block .env, .git, and other sensitive file exposure
    location ~* /\.(env|git|svn|htaccess|htpasswd|DS_Store|travis\.yml) {
        return 444;
    }

    # Block PHP file probes (we don't run PHP)
    location ~* \.php$ {
        return 444;
    }

    # Block WordPress scanner paths
    location ~* /(wp-admin|wp-content|wp-includes|wp-login|wp-config|xmlrpc) {
        return 444;
    }

    # Block vendor/phpunit and eval-stdin probes
    location ~* /(vendor|phpunit|eval-stdin) {
        return 444;
    }

    # Block common shell/backdoor file names
    location ~* /(shell|webshell|backdoor|c99|r57|adminfuns|green|zoper|bolt|bless|sadcut) {
        return 444;
    }

    # ── WebSocket signaling for P2P transfers — long-lived connections ─────────
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;

        client_max_body_size 512M;
    }
}

server {
    listen 80;
    server_name q-safe.live www.q-safe.live;
    return 301 https://$host$request_uri;
}

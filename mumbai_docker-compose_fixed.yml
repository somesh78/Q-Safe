version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: q_safe_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qsafe_password
      POSTGRES_DB: postgres
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: q_safe_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: q-safe_web
    container_name: q_safe_web
    expose:
      - "8000"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/storage:/app/storage
      - ./backend/data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: "False"
      DATABASE_URL: postgresql://postgres:qsafe_password@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celerybeat:
    image: q-safe_celerybeat
    container_name: q_safe_celerybeat
    command: celery -A backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: on-failure

  nginx:
    image: nginx:stable-alpine
    container_name: q_safe_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: always

  turn:
    image: coturn/coturn:latest
    container_name: q_safe_turn
    network_mode: "host"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: always

volumes:
  redis_data:
  postgres_data:
